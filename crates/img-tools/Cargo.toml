[package]
name = "trustyshelf-imgtools"
version = "1.3.0"
edition = "2021"
description = "Native image manipulation and spine-cutting engine for (T)rustyShelf"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
ab_glyph = "0.2"
quick-xml = "0.42"
unicode-normalization = "0.1"
