# (T)rustyShelf release builds: Windows (portable exe), Linux (AppImage) and Android (APK), as one GitHub release.
# Started by a push to t-rustyshelf whose (last) commit message asks for it; any other push builds nothing:
#   "For version A.B.C"        → A.B.C.0, a new version (stops with an error if vA.B.C.0 is already released)
#   "For build"                → the next build of the newest version released (2.12.4.283 → 2.12.4.284)
#   "For build A.B.C[.DDDD]"   → the next build of that version
# The version is A.B.C.DDDD (DDDD the build of A.B.C); the release's tag is vA.B.C.DDDD. A build (DDDD > 0) is published as a
# pre-release, a new version (A.B.C.0) as the latest release. Desktop builds carry it as
# A.B.C+DDDD (the form npm and electron-builder take) and show it as A.B.C.DDDD; Android as its versionName, with a
# versionCode that grows with every build. The rules: scripts/release-version.js (tested by linux/ci/release-version-test.js).
name: Release

on:
  push:
    branches: [t-rustyshelf]

permissions:
  contents: read

concurrency:
  group: release # (one at a time, none cancelled: each build counts from the release before it)
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      semver: ${{ steps.v.outputs.semver }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the commit message and the releases already there
        id: v
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          git fetch --tags --force --quiet
          git tag -l 'v*' > "$RUNNER_TEMP/tags.txt"
          node scripts/release-version.js "$MSG" "$RUNNER_TEMP/tags.txt" "$(node -p "require('./package.json').version")" | tee -a "$GITHUB_OUTPUT"

      - name: Summary
        env:
          BUILD: ${{ steps.v.outputs.build }}
          VERSION: ${{ steps.v.outputs.version }}
          REASON: ${{ steps.v.outputs.reason }}
        run: |
          if [ "$BUILD" = true ]; then echo "### Building (T)rustyShelf $VERSION ($REASON)" >> "$GITHUB_STEP_SUMMARY"
          else echo "### No release build: $REASON" >> "$GITHUB_STEP_SUMMARY"; fi

  linux:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the AppImage
        run: >
          npx electron-builder --linux AppImage --publish never
          -c.extraMetadata.version=${{ needs.decide.outputs.semver }}
          -c.buildVersion=${{ needs.decide.outputs.version }}
          -c.linux.artifactName=TrustyShelf-${{ needs.decide.outputs.version }}-linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/TrustyShelf-${{ needs.decide.outputs.version }}-linux.AppImage
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the portable exe
        shell: bash
        run: >
          npx electron-builder --win portable --publish never
          -c.extraMetadata.version=${{ needs.decide.outputs.semver }}
          -c.buildVersion=${{ needs.decide.outputs.version }}
          -c.win.artifactName=TrustyShelf-${{ needs.decide.outputs.version }}-windows-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TrustyShelf-${{ needs.decide.outputs.version }}-windows-portable.exe
          if-no-files-found: error
          retention-days: 3

  android:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install Capacitor
        working-directory: android-app
        run: npm ci --no-audit --no-fund
      - name: Set the version (the APK's versionName and the app's own build line)
        working-directory: android-app
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: node -e "const f='package.json',fs=require('fs'),p=JSON.parse(fs.readFileSync(f));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Copy the shared UI into the Android app
        working-directory: android-app
        run: npm run sync
      - name: Build the APK
        working-directory: android-app/android
        env:
          TRUSTYSHELF_VERSION_CODE: ${{ needs.decide.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TrustyShelf-${{ needs.decide.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: TrustyShelf-${{ needs.decide.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [decide, linux, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
          TAG: ${{ needs.decide.outputs.tag }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          printf '%s\n' "$MSG" > notes.md
          # a build (A.B.C.DDDD, DDDD > 0) is a pre-release, to try out; a new version (A.B.C.0) is the latest release
          pre=; case "$VERSION" in *.0) ;; *) pre=--prerelease ;; esac
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "(T)rustyShelf $VERSION" --notes-file notes.md $pre
